name: Smoke Test & System Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment & Package Imports
        run: |
          python -c "import src; print('Package import successful')"

      - name: Run Environment Smoke Test
        run: |
          python -c "
          from src.environment import EnergyHarvestingDVFSEnv
          env = EnergyHarvestingDVFSEnv()
          obs, _ = env.reset(seed=42)
          for _ in range(50):
              obs, reward, term, trunc, info = env.step(env.action_space.sample())
              if term or trunc:
                  break
          print('Environment smoke test passed successfully!')
          "

      - name: Ensure Native C Compiler Available (for Hardware Parity Test)
        run: |
          gcc --version || (sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential)
          gcc --version

      - name: Verify On-Chip C Policy Matches PyTorch Reference (Hardware Validation Regression Test)
        run: |
          set -o pipefail
          pytest tests/test_c_policy_parity.py -v -rs 2>&1 | tee pytest_parity_output.txt

      - name: Upload Parity Test Output (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-test-output
          path: pytest_parity_output.txt
