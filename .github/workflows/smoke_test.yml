name: Smoke Test & System Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment & Package Imports
        run: |
          python -c "import src; print('Package import successful')"

      - name: Run Environment Smoke Test
        run: |
          python -c "
          from src.environment import EnergyHarvestingDVFSEnv
          env = EnergyHarvestingDVFSEnv()
          obs, _ = env.reset(seed=42)
          for _ in range(50):
              obs, reward, term, trunc, info = env.step(env.action_space.sample())
              if term or trunc:
                  break
          print('Environment smoke test passed successfully!')
          "
